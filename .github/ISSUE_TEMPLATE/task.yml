name: Task
description: A concrete unit of work that belongs to a user story
title: "[Task]: "
labels: ["task"]
# assignees: ["your-github-username"]   # optional: auto-assign someone

body:
  - type: markdown
    attributes:
      value: |
        Use this template for a concrete, technical piece of work.
        After creating the task, set its **parent user story** (Relationships → Add parent).

  - type: input
    id: parent_story
    attributes:
      label: Parent user story
      description: Issue number of the user story this task belongs to.
      placeholder: e.g. #5
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done, and why?
      placeholder: Set up the PostgreSQL database for the asset tracking service.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Implementation steps
      description: Break the work into concrete steps.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How do we know this task is complete?
      placeholder: |
        - [ ] Code merged to main
        - [ ] Tested in staging
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where will this work be applied?
      multiple: true
      options:
        - Production
        - Staging
        - Development
        - Local
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and this task does not already exist.
          required: true
